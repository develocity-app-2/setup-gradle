name: 'Setup Gradle'
description: 'Mock setup-gradle for the Develocity GitHub App demo'

inputs:
  develocity-url:
    description: 'Develocity server URL. Without it, setup-gradle does not contact Develocity at all.'
    required: false
    default: ''
  audience:
    description: 'Audience for the OIDC token. Defaults to the Develocity app URL.'
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'index.js'
